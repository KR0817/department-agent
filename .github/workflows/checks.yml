name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Build React frontend
        run: npm --prefix frontend run build
      - name: Test React frontend
        run: npm --prefix frontend test
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check public source boundary
        run: uv run --frozen python scripts/release_check.py
      - name: Run module tests
        run: uv run --frozen python scripts/check.py
      - name: Run assistant and knowledge state tests
        run: node --test tests/assistant_state.test.cjs tests/knowledge_state.test.cjs
      - name: Run isolated integration smoke
        run: uv run --frozen python scripts/smoke_test.py
